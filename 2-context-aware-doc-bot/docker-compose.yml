services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

  api:
    build: ./backend
    command: python main.py
    ports:
      - "5000:5000"
    env_file: ./backend/.env
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app
      # Filesystem-based Celery broker/backend requires the api and worker
      # containers to share this directory (see worker/app.py "ponytail" note).
      - celery_data:/tmp/doc_bot_celery

  worker:
    build: ./backend
    command: celery -A worker.app worker --loglevel=info --concurrency=2
    env_file: ./backend/.env
    depends_on:
      - qdrant
    volumes:
      - ./backend:/app
      - celery_data:/tmp/doc_bot_celery

volumes:
  qdrant_data:
  celery_data:
