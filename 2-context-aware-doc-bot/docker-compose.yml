services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}

  api:
    build: ./backend
    command: python main.py
    ports:
      - "5000:5000"
    env_file: ./backend/.env
    depends_on:
      - redis
      - qdrant
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    command: celery -A worker.app worker --loglevel=info --concurrency=2
    env_file: ./backend/.env
    depends_on:
      - redis
      - qdrant
    volumes:
      - ./backend:/app

volumes:
  qdrant_data:
  redis_data:
