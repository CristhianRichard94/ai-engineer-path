# Fly.io configuration for the context-aware-doc-bot backend.
# Deploys two process groups from the same image: `api` (Flask) and
# `worker` (Celery), mirroring docker-compose.yml's api/worker services.
#
# Deploy from this directory with: fly deploy
#
# IMPORTANT: docker-compose.yml runs local `redis` and `qdrant` containers
# for dev only. Fly.io does NOT self-host either here — production must
# point REDIS_URL and QDRANT_URI/QDRANT_API_KEY at managed services
# (e.g. Upstash Redis, Qdrant Cloud) via secrets. config.py already reads
# these from the environment, so no code changes are needed.
#
# Before first deploy:
#   fly apps create doc-bot-backend   (or update `app` below to match your app name)
#   fly secrets set OPENAI_API_KEY=sk-...
#   fly secrets set REDIS_URL=rediss://...        (e.g. Upstash Redis URL)
#   fly secrets set QDRANT_URI=https://...        (e.g. Qdrant Cloud endpoint)
#   fly secrets set QDRANT_API_KEY=...

app = "doc-bot-backend"
primary_region = "iad"

[build]

[processes]
  api = "python main.py"
  worker = "celery -A worker.app worker --loglevel=info --concurrency=2"

[env]
  PORT = "5000"
  APP_ENV = "production"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["api"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  processes = ["api"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
  processes = ["worker"]
