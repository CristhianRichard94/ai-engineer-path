# fly.toml app configuration file generated for doc-bot-backend on 2026-07-03T11:03:27-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'doc-bot-backend'
primary_region = 'iad'

[build]

[env]
  APP_ENV = 'production'
  PORT = '5000'

[processes]
  api = 'python main.py'
  worker = 'celery -A worker.app worker --loglevel=info --concurrency=2'

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['api']

# api and worker MUST run on the same machine: the celery filesystem broker
# reads/writes queue files and the commit cache on local disk, which is not
# shared across separate Fly Machines (or Fly Volumes attached to different
# machines). Splitting them into separate [[vm]] blocks would put them on
# distinct machines with distinct disks, breaking task delivery.
[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
  processes = ['api', 'worker']
