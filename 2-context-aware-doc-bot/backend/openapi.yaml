openapi: 3.0.0
info:
  title: Context-Aware Doc Bot API
  version: 1.0.0
  description: A simple API for processing repository URLs and querying context-aware prompts.
servers:
  - url: /api
    description: Local API base path
paths:
  /prompt:
    post:
      summary: Process a repository URL and query context for a prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Repository URL to process
                  example: https://github.com/CristhianRichard94/spacetrip
                prompt:
                  type: string
                  description: Question or prompt for the repository context
                  example: Give me a short summary of this repository and mention key files.
              required:
                - url
      responses:
        '200':
          description: Successful response with context-aware reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
        '400':
          description: Bad request; missing required fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '500':
          description: Server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
